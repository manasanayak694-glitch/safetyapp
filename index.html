<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Emergency Hub</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 360px; text-align: center; }
        h2 { color: #1f2937; margin-bottom: 20px; font-size: 20px; }
        .status-box { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; font-size: 14px; color: #4b5563; margin-bottom: 20px; }
        .contact-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #fee2e2; 
            border: 1px solid #fca5a5;
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px;
        }
        .send-btn { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .send-btn:active { background: #b91c1c; }
        .config-section { border-top: 1px solid #e5e7eb; padding-top: 20px; margin-top: 20px; text-align: left; }
        label { font-size: 12px; font-weight: 600; color: #4b5563; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
        .action-btn { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>STUDENT EMERGENCY HUB</h2>
    <div class="status-box" id="statusMessage">System Armed. Tap "SEND ALERT" next to any name.</div>

    <!-- The dynamic contact directory section -->
    <div id="contactsContainer"></div>

    <div class="config-section">
        <label>ADD NEW TRUSTED CONTACT:</label>
        <input type="text" id="friendName" placeholder="Friend's Name (e.g., Priya)" />
        <input type="tel" id="friendPhone" placeholder="Phone Number (e.g., 9035353393)" />
        <button class="action-btn" onclick="addContact()">ADD TO SAFETY DIRECTORY</button>
    </div>
</div>

<script>
    let directory = [];

    window.onload = function() {
        const saved = localStorage.getItem('safetyDirectory');
        if (saved) {
            directory = JSON.parse(saved);
            renderDirectory();
        }
    };

    function addContact() {
        const nameInput = document.getElementById('friendName');
        const phoneInput = document.getElementById('friendPhone');
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();

        if (name && phone) {
            directory.push({ name: name, phone: phone });
            localStorage.setItem('safetyDirectory', JSON.stringify(directory));
            nameInput.value = "";
            phoneInput.value = "";
            renderDirectory();
        } else {
            alert("Please fill in both Name and Phone field paths.");
        }
    }

    function removeContact(index) {
        directory.splice(index, 1);
        localStorage.setItem('safetyDirectory', JSON.stringify(directory));
        renderDirectory();
    }

    function renderDirectory() {
        const container = document.getElementById('contactsContainer');
        if (directory.length === 0) {
            container.innerHTML = "<p style='color:#6b7280; font-size:14px;'>Your safety directory is empty. Add friends below!</p>";
            return;
        }

        container.innerHTML = directory.map((contact, index) => `
            <div class="contact-item">
                <div style="text-align: left;">
                    <strong style="color:#111827;">${contact.name}</strong><br>
                    <span style="color:#4b5563; font-size:12px;">${contact.phone}</span>
                </div>
                <div>
                    <button class="send-btn" onclick="sendToTarget('${contact.phone}')">SEND ALERT</button>
                    <button onclick="removeContact(${index})" style="background:none; border:none; color:#9ca3af; margin-left:8px; cursor:pointer;">✕</button>
                </div>
            </div>
        `).join('');
    }

    function sendToTarget(targetPhone) {
        const statusBox = document.getElementById('statusMessage');
        statusBox.innerHTML = "Fetching real-time GPS coordinates...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    statusBox.innerHTML = "Location secure! Launching native SMS interface...";
                    
                    const mapLink = `https://google.com{lat},${lng}`;
                    const smsText = `EMERGENCY! I need assistance. Track my current location live here: ${mapLink}`;
                    
                    // Direct programmatic device redirect hook to only text the chosen recipient
                    window.location.href = `sms:${targetPhone}?&body=${encodeURIComponent(smsText)}`;
                },
                (error) => {
                    statusBox.innerHTML = "<span style='color:#ef4444;'>Error: Please permit location settings.</span>";
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        } else {
            statusBox.innerHTML = "Error: Browser location engine missing.";
        }
    }
</script>
</body>
</html>
